name: Deploy TalkinChat to VM

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: talkinchat-deploy-vm
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Test deployment contracts
        run: |
          python3 -m unittest discover -v
          bash tests/test_deploy_install.sh
          python3 -m compileall -q bot.py commands.py config.py config_store.py command_modules services transports
          TALKINCHAT_USERNAME=check TALKINCHAT_PASSWORD=check TALKINCHAT_ROOM=check \
            TALKINCHAT_STATE_DIR=/tmp/talkinchat-readiness \
            python3 bot.py --check-readiness

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy TalkinChat files
        run: |
          release_id="${GITHUB_SHA}"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
            "mkdir -p /opt/talkinchat/incoming/${release_id}"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.env' \
            --exclude='*.env' \
            --exclude='.venv' \
            --exclude='state' \
            ./ "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/opt/talkinchat/incoming/${release_id}/"

      - name: Install and verify TalkinChat service
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" '
              set -eu
              cd /opt/talkinchat/incoming/${{ github.sha }}
              bash deploy/release.sh "${{ github.sha }}" "/opt/talkinchat/incoming/${{ github.sha }}"
              test -f /etc/talkinchat-bot.env
              test "$(stat -c %a /etc/talkinchat-bot.env)" = "640"
              test -d /var/lib/talkinchat-bot
              test -L /opt/talkinchat/current
              systemctl is-enabled talkinchat-bot.service
              if systemctl is-active --quiet talkinchat-bot.service; then
                echo "TalkinChat service is active."
              else
                echo "TalkinChat service is installed and waiting for credentials."
              fi
            '
